<div class="contact">
  <div class="pane9x">
    <p class="intro">
      I am open to senior fullstack roles and to interesting problems in
      performance, architecture and legacy modernisation. The fastest way to
      reach me is email.
    </p>

    <fieldset class="group9x form">
      <legend>Contact details</legend>

      <label class="row">
        <span class="label">Email:</span>
        <span class="field9x">{{ profile.email }}</span>
      </label>

      <label class="row">
        <span class="label">GitHub:</span>
        <span class="field9x">{{ profile.githubUser }}</span>
      </label>

      <label class="row">
        <span class="label">LinkedIn:</span>
        <span class="field9x">{{ profile.linkedinUser }}</span>
      </label>

      <label class="row">
        <span class="label">Location:</span>
        <span class="field9x">{{ profile.location }}</span>
      </label>
    </fieldset>

    <div class="buttons">
      <a
        class="btn9x"
        [href]="profile.github"
        target="_blank"
        rel="noreferrer noopener"
      >
        <app-icon name="github" [size]="14" />
        GitHub
      </a>
      <a
        class="btn9x"
        [href]="profile.linkedin"
        target="_blank"
        rel="noreferrer noopener"
      >
        <app-icon name="linkedin" [size]="14" />
        LinkedIn
      </a>
    </div>
  </div>

  <div class="statusbar">
    <span class="grow">© {{ year }} {{ profile.name }}</span>
    <span>Built with Angular</span>
  </div>
</div>
